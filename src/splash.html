<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Kannibal Launcher</title>
<style>
  @font-face {
    font-family: "Display";
    src: url("../assets/fonts/BigShoulders-Bold.ttf") format("truetype");
    font-weight: 700;
  }
  @font-face {
    font-family: "Mono";
    src: url("../assets/fonts/JetBrainsMono-Regular.ttf") format("truetype");
    font-weight: 400;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: #07050d;
    color: #eaf5f4;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }

  .splash {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }

  .logo-wrap {
    position: relative;
    width: 96px;
    height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(139, 92, 246, 0.15);
    border-top-color: #8b5cf6;
    animation: spin 1.1s linear infinite;
  }

  .logo-img {
    width: 62px;
    height: 62px;
    object-fit: contain;
    filter: drop-shadow(0 0 14px rgba(139, 92, 246, 0.45));
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }

  .brand {
    font-family: "Display", sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 3px;
  }
  .brand .accent { color: #8b5cf6; }

  .status {
    font-family: "Mono", monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #9d94bd;
  }

  .progress-track {
    width: 160px;
    height: 3px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
    border-radius: 2px;
  }
  .progress-fill {
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, #5b34b0, #8b5cf6);
    animation: slide 1.3s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  .tip { max-width: 300px; text-align: center; font-size: 12px; color: #b9b0d6; line-height: 1.5; min-height: 36px; transition: opacity .4s; }
</style>
</head>
<body>
  <div class="splash">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <img src="../assets/logo.png" alt="" class="logo-img" />
    </div>
    <div class="brand">B<span class="accent">2</span> LAUNCHER</div>
    <div class="status">Vérification des mises à jour…</div>
    <div class="tip" id="tip"></div>
    <div class="progress-track"><div class="progress-fill"></div></div>
  </div>
<script>
  const TIPS = [
    "Astuce : clique sur ton avatar Discord pour ouvrir ton profil et exporter ta carte.",
    "Astuce : le bloc-notes garde tes coordonnées et idées de personnage sur ton PC.",
    "Astuce : active le mode présentation avant de lancer un live.",
    "« Le meilleur moment pour jouer, c'est quand on est ensemble. »",
    "Astuce : choisis ton thème dans les options (il y en a un secret…).",
    "Astuce : « Quoi de neuf » liste toutes les nouveautés du launcher.",
    "Fais le Konami code : une petite surprise t'attend.",
    "Tape « kannibal » au clavier… on ne sait jamais.",
    "Le logo en haut du launcher n'aime pas qu'on l'ignore.",
    "Des secrets se cachent dans le launcher. Les trouveras-tu tous ?",
    "« Chaque aventure commence par un premier pas. » — KannibAventure arrive en décembre."
  ];
  const tip = document.getElementById("tip");
  let i = Math.floor(Math.random() * TIPS.length);
  tip.textContent = TIPS[i];
  setInterval(() => { tip.style.opacity = 0; setTimeout(() => { i = (i + 1) % TIPS.length; tip.textContent = TIPS[i]; tip.style.opacity = 1; }, 400); }, 3500);
</script>
</body>
</html>
